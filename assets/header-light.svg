<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 244" width="840" height="244" role="img" aria-label="Muhammad Uzair, AI Engineer, UK">
  <style>
    @font-face { font-family: "MM"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 800; }
    @font-face { font-family: "MM"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 500; }
    text { font-family: "MM", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-weight: 800; font-size: 56px; fill: #15151A; }
    .role { font-weight: 500; font-size: 12px; fill: #6B6B76; }
    .id { font-weight: 500; font-size: 11px; fill: #6B6B76; }
    .msg { font-weight: 500; font-size: 17px; fill: #15151A; }
    .s { animation: in 0.18s ease-out both; }
    .cur { fill: #15151A; animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .s, .cur { animation: none; } }
  </style>
  <text x="0" y="34" class="role">user</text>
  <text x="120" y="35" class="msg">whoami</text>
  <line x1="0" y1="60.5" x2="840" y2="60.5" stroke="#D8D8DE"/>
  <text x="0" y="104" class="role">assistant</text>
  <g class="s" style="animation-delay:0.50s">
    <rect x="121.5" y="86" width="114.6" height="70" rx="7" fill="#FFD6A5"/>
    <text x="120.0" y="140" class="name">Muh</text>
    <text x="123.0" y="176" class="id">44</text>
  </g>
  <g class="s" style="animation-delay:0.78s">
    <rect x="239.1" y="86" width="193.0" height="70" rx="7" fill="#B9E6C9"/>
    <text x="237.6" y="140" class="name">ammad</text>
    <text x="240.6" y="176" class="id">7405</text>
  </g>
  <g class="s" style="animation-delay:1.06s">
    <rect x="435.1" y="86" width="114.6" height="70" rx="7" fill="#C7D2FE"/>
    <text x="472.8" y="140" class="name">Uz</text>
    <text x="436.6" y="176" class="id">549</text>
  </g>
  <g class="s" style="animation-delay:1.34s">
    <rect x="552.7" y="86" width="114.6" height="70" rx="7" fill="#FBC4DD"/>
    <text x="551.2" y="140" class="name">air</text>
    <text x="554.2" y="176" class="id">1334</text>
  </g>
  <g class="s" style="animation-delay:1.85s">
    <text x="120" y="220" class="msg">AI Engineer · UK</text>
    <rect x="318.4" y="204" width="10" height="20" class="cur"/>
  </g>
  <line x1="0" y1="243.5" x2="840" y2="243.5" stroke="#D8D8DE"/>
</svg>
